[package]
name = "rp2040-min"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
portable-atomic = { version = "1.5", features = ["critical-section"] }
static_cell = "2.1"
fixed = "1.23.1"

# OLED / graphics
embedded-graphics = "0.8.2"
embedded-hal = "1.0"
embedded-hal-bus = "0.3.0"
heapless = "0.9.3"
ibm437 = "0.4.0"
ssd1306 = "0.10.0"

# Embassy async runtime + RP2040 HAL
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1" }
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = "0.1.2"
# Wi-Fi networking stack. Optional: only the `wifi` feature pulls it in. The
# Bluetooth milestone (default) builds without it.
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "proto-ipv4"], optional = true }

# CYW43 wireless chip (Pico W). The `bluetooth` feature exposes the chip's BT
# HCI controller (used via trouble-host below) alongside Wi-Fi.
cyw43 = { version = "0.7.0", features = ["bluetooth"] }
cyw43-pio = { version = "0.10.0" }

# TrouBLE: pure-Rust BLE host stack. Drives the cyw43 BT controller as a BLE
# central so we can scan for, bond with, and read HID reports from an Xbox
# controller. Pinned to a git rev: the published crate needs bt-hci 0.9, which
# only lines up with the embassy git rev pinned in [patch.crates-io] below.
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "20e12480a3e74b757afb769797173bfc2f8f1951", features = ["scan", "security", "default-packet-pool-mtu-128"] }

[features]
# Default to the Bluetooth/Xbox-controller milestone. The Wi-Fi path is
# mutually exclusive for now: enabling cyw43's `bluetooth` feature changes the
# cyw43 `Runner` type, so `wireless.rs` only compiles under a BT-less build
# (`--no-default-features --features wifi`). Unifying the two onto a single
# `new_with_bluetooth` bring-up is future coexistence work.
default = ["bluetooth"]
bluetooth = []
wifi = ["dep:embassy-net"]

[build-dependencies]

[profile.release]
panic = "abort"

# trouble-host (git HEAD) requires bt-hci 0.9, which the published cyw43 0.7.0
# does not. The embassy git rev below ships a cyw43 that uses bt-hci 0.9; this
# is the exact combination the trouble examples are tested against. Pinning all
# embassy crates to the same rev keeps a single, consistent embassy in the tree.
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }
